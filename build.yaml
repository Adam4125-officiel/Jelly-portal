description: >
  Adds a permanent icon to the header of the Jellyfin web client that reflects the
  overall state of your self-hosted services as reported by your status portal
  (up, degraded, down, maintenance in progress or coming up). Clicking it opens a
  panel with the details: services, maintenance windows and announcements.
  Requires the File Transformation plugin.
